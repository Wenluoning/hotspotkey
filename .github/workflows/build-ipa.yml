name: build-ipa

on:
  workflow_dispatch:
  push:
    paths:
      - "source.zip"
      - "ci/**"
      - ".github/workflows/build-ipa.yml"

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译并打包 ipa
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          swift --version
          python3 --version

      - name: 解压源码并编译
        run: bash ci/build.sh

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: HotspotKey-ipa
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 30
